<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#232733" />
      <stop offset="60%" stop-color="#12141a" />
      <stop offset="100%" stop-color="#090a0d" />
    </radialGradient>

    <radialGradient id="ambientAmber" cx="52%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Rim Stroke -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#3d4457" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.35" />
    </linearGradient>

    <!-- Letter G Main Gradient -->
    <linearGradient id="gMainGrad" x1="20%" y1="15%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fff1d6" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Accent Pen Nib Gradient -->
    <linearGradient id="nibGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowG" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.2" />
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas (macOS / Modern Windows standard) -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bgGlow)" stroke="url(#rimStroke)" stroke-width="5" />
  
  <!-- Subtle Internal Rim Highlight -->
  <rect x="74" y="74" width="876" height="876" rx="198" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />

  <!-- Ambient Golden Center Glow -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#ambientAmber)" />

  <!-- Geometric Decorative Editorial Circles (Subtle) -->
  <circle cx="512" cy="512" r="320" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1.5" stroke-dasharray="8 8" fill="none" />
  <circle cx="512" cy="512" r="210" stroke="rgba(245, 158, 11, 0.05)" stroke-width="1" fill="none" />

  <!-- Customized Letter G Group -->
  <g filter="url(#shadowG)">
    <!-- Main Outer Body of Letter G -->
    <!-- Formed with precision bezier curves, modern thick geometric stroke, chiseled top cut, and integrated horizontal caret bar -->
    <path d="
      M 690 320
      L 630 380
      C 595 348 555 330 508 330
      C 402 330 324 412 324 518
      C 324 624 402 706 508 706
      C 604 706 678 642 692 550
      L 512 550
      L 512 470
      L 772 470
      C 776 470 780 474 780 478
      L 780 540
      C 762 678 650 786 508 786
      C 354 786 236 668 236 518
      C 236 368 354 250 508 250
      C 578 250 642 276 690 320
      Z
    " fill="url(#gMainGrad)" />

    <!-- Pen-Nib / Quill Inlay Accent in the horizontal bar -->
    <path d="
      M 752 485
      L 770 510
      L 752 535
      L 560 535
      L 560 485
      Z
    " fill="url(#nibGrad)" opacity="0.35" />

    <!-- Editorial Nib Slit Detail -->
    <line x1="560" y1="510" x2="745" y2="510" stroke="#12141a" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Distinctive Diamond Caret Spark (Symbol of AI writing & language precision) -->
  <g filter="url(#sparkleGlow)">
    <!-- Floating Spark at top-right aperture -->
    <path d="
      M 740 270
      C 740 286 754 300 770 300
      C 754 300 740 314 740 330
      C 740 314 726 300 710 300
      C 726 300 740 286 740 270
      Z
    " fill="#fbbf24" />

    <circle cx="740" cy="300" r="3" fill="#ffffff" />
  </g>

  <!-- Minor Accent Spark on the bottom curve -->
  <circle cx="688" cy="670" r="4.5" fill="#f59e0b" opacity="0.75" />
  <circle cx="688" cy="670" r="2" fill="#fff" opacity="0.9" />
</svg>
