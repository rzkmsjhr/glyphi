<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#262b3a" />
      <stop offset="55%" stop-color="#14161f" />
      <stop offset="100%" stop-color="#0a0b10" />
    </radialGradient>

    <radialGradient id="ambientBlue" cx="52%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Rim Stroke -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#4f5873" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.45" />
    </linearGradient>

    <!-- Letter G Main Gradient -->
    <linearGradient id="gMainGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e0f2fe" />
      <stop offset="65%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Accent Pen Nib Gradient -->
    <linearGradient id="nibGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowG" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3b82f6" flood-opacity="0.25" />
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full Bleed Squircle Base Canvas (Maximized taskbar presence) -->
  <rect x="16" y="16" width="992" height="992" rx="220" fill="url(#bgGlow)" stroke="url(#rimStroke)" stroke-width="8" />
  
  <!-- Subtle Internal Rim Highlight -->
  <rect x="28" y="28" width="968" height="968" rx="208" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Ambient Blue Center Glow -->
  <rect x="16" y="16" width="992" height="992" rx="220" fill="url(#ambientBlue)" />

  <!-- Geometric Decorative Editorial Circles (Subtle background texture) -->
  <circle cx="512" cy="512" r="390" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" stroke-dasharray="10 10" fill="none" />
  <circle cx="512" cy="512" r="260" stroke="rgba(59, 130, 246, 0.08)" stroke-width="1.5" fill="none" />

  <!-- Customized Bold Letter G Group -->
  <g filter="url(#shadowG)">
    <!-- Formed with precision bezier curves, bold proportions, chiseled aperture, and horizontal quill crossbar -->
    <path d="
      M 763 239
      L 680 322
      C 632 278 577 253 512 253
      C 366 253 258 366 258 512
      C 258 658 366 771 512 771
      C 644 771 747 683 766 556
      L 518 556
      L 518 446
      L 876 446
      C 882 446 887 451 887 457
      L 887 542
      C 862 732 708 882 512 882
      C 300 882 137 719 137 512
      C 137 305 300 142 512 142
      C 609 142 697 178 763 239
      Z
    " fill="url(#gMainGrad)" />

    <!-- Pen-Nib / Quill Inlay Accent in the horizontal bar -->
    <path d="
      M 850 466
      L 872 501
      L 850 536
      L 584 536
      L 584 466
      Z
    " fill="url(#nibGrad)" opacity="0.4" />

    <!-- Editorial Nib Slit Detail -->
    <line x1="584" y1="501" x2="840" y2="501" stroke="#101217" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Distinctive Diamond Caret Spark (Symbol of AI writing & language precision) -->
  <g filter="url(#sparkleGlow)">
    <!-- Floating Spark at top-right aperture -->
    <path d="
      M 830 190
      C 830 212 848 230 870 230
      C 848 230 830 248 830 270
      C 830 248 812 230 790 230
      C 812 230 830 212 830 190
      Z
    " fill="#60a5fa" />

    <circle cx="830" cy="230" r="4" fill="#ffffff" />
  </g>

  <!-- Minor Accent Spark on the bottom curve -->
  <circle cx="755" cy="730" r="6" fill="#3b82f6" opacity="0.8" />
  <circle cx="755" cy="730" r="2.5" fill="#fff" opacity="0.95" />
</svg>
